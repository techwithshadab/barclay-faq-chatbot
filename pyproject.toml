[project]
name = "faq-parser"
version = "0.1.0"
description = "Parse FAQs from websites for RAG chatbot"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.48.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.35.0",
    "openai>=1.30.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "faiss-cpu>=1.8.0",
    "tiktoken>=0.7.0",
]

[tool.uv]

